name: farm

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Run only the first N pull requests of farm/prs.json (0 runs all of them)
        default: "0"
      only:
        description: Run only these pull requests, as owner/repo#number separated by spaces (empty runs the list)
        default: ""
      list:
        description: The list of pull requests to read
        default: farm/prs.json
      offset:
        description: Skip the first N pull requests of the list (a run takes at most 256)
        default: "0"
      kern:
        description: The Kern branch, tag or commit every job builds
        default: one
      runtime:
        description: runsc runs the pull requests' code in gVisor; runc runs it in locked containers on the throwaway runner, the way CI does
        default: runsc

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      prs: ${{ steps.list.outputs.prs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: farm
      - name: List the pull requests
        id: list
        env:
          LIMIT: ${{ inputs.limit }}
          ONLY: ${{ inputs.only }}
          LIST: ${{ inputs.list }}
          OFFSET: ${{ inputs.offset }}
        run: |
          set -euo pipefail
          [[ "$LIMIT" =~ ^[0-9]+$ && "$OFFSET" =~ ^[0-9]+$ ]] || { echo "::error::limit and offset must be whole numbers"; exit 1; }
          [[ "$LIST" =~ ^farm/[A-Za-z0-9_.-]+\.json$ && -f "$LIST" ]] || { echo "::error::list must be a JSON file in farm/"; exit 1; }
          jq -c --argjson n "$LIMIT" --argjson o "$OFFSET" --arg only "$ONLY" '($only | split(" ") | map(select(length > 0))) as $wanted
            | (if ($wanted | length) > 0 then map(select((.repo + "#" + (.number | tostring)) as $k | $wanted | index($k))) else . end)
            | .[$o:]
            | (if $n > 0 then .[:$n] else . end)
            | map({ repo, number, agent, base_sha, head_sha, old_sha: (.merge_base // .base_sha), patch: (.patch // ""), round: (.round // 0), investigation: (.investigation // "") })' "$LIST" > plan.json
          [ "$(jq length plan.json)" -gt 0 ] || { echo "::error::$LIST lists no pull requests there"; exit 1; }
          [ "$(jq length plan.json)" -le 256 ] || { echo "::error::a run takes at most 256 pull requests; use limit and offset"; exit 1; }
          echo "prs=$(cat plan.json)" >> "$GITHUB_OUTPUT"
          echo "$(jq length plan.json) pull requests" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: plan
          path: plan.json

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jastijayakrishna/Kerner
          ref: ${{ inputs.kern }}
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: farm-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'src/**') }}
          restore-keys: farm-cargo-${{ runner.os }}-
      - name: Build Kern
        run: |
          set -euo pipefail
          command -v musl-gcc > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools > /dev/null; }
          rustup target add x86_64-unknown-linux-musl > /dev/null
          CC_x86_64_unknown_linux_musl=musl-gcc cargo build --release --locked --target x86_64-unknown-linux-musl
          target/x86_64-unknown-linux-musl/release/kern --version
          echo "Kern at $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kern
          path: target/x86_64-unknown-linux-musl/release/kern
          if-no-files-found: error

  check:
    needs: [plan, build]
    name: ${{ matrix.pr.repo }}#${{ matrix.pr.number }}
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        pr: ${{ fromJSON(needs.plan.outputs.prs) }}
    env:
      REPO: ${{ matrix.pr.repo }}
      NUMBER: ${{ matrix.pr.number }}
      AGENT: ${{ matrix.pr.agent }}
      BASE_SHA: ${{ matrix.pr.base_sha }}
      HEAD_SHA: ${{ matrix.pr.head_sha }}
      OLD_SHA: ${{ matrix.pr.old_sha }}
      PATCH: ${{ matrix.pr.patch }}
      ROUND: ${{ matrix.pr.round }}
      INVESTIGATION: ${{ matrix.pr.investigation }}
      KERN_BIN: ${{ github.workspace }}/bin/kern
    steps:
      - name: Check out the farm's list
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: farm-repo
          sparse-checkout: farm
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: kern
          path: bin

      - name: Kern
        run: |
          echo build > "$RUNNER_TEMP/stage"
          chmod +x "$KERN_BIN" && "$KERN_BIN" --version

      - name: gVisor
        if: inputs.runtime != 'runc'
        shell: bash
        run: |
          echo gvisor > "$RUNNER_TEMP/stage"
          for tool in docker git jq curl; do command -v "$tool" > /dev/null || { echo "::error::kern-drive needs $tool on the runner"; exit 1; }; done
          if ! docker info --format '{{json .Runtimes}}' | grep '"runsc"' > /dev/null; then
            command -v apt-get > /dev/null || { echo "::error::Docker has no gVisor runtime (runsc) and this runner is not Ubuntu or Debian: install gVisor for Docker first"; exit 1; }
            curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor --yes -o /usr/share/keyrings/gvisor-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
              | sudo tee /etc/apt/sources.list.d/gvisor.list > /dev/null
            sudo apt-get update -qq && sudo apt-get install -y -qq runsc > /dev/null
            sudo runsc install && sudo systemctl restart docker
          fi

      - name: Verifier
        shell: bash
        env:
          RUNTIME: ${{ inputs.runtime == 'runc' && 'runc' || 'runsc' }}
        run: |
          echo verifier > "$RUNNER_TEMP/stage"
          [ -x "$KERN_BIN" ] || { echo "::error::Kern is not installed: the Install Kern step failed"; exit 1; }
          W="$RUNNER_TEMP/kern-drive" && rm -rf "$W" && mkdir -p "$W/checks" && cd "$W"
          real() { readlink -f "$(command -v "$1")"; }
          hash() { sha256sum "$1" | cut -d' ' -f1; }
          if [ "$RUNTIME" = runc ]; then
            runtime=$(real runc)
            printf '{"host":"github-actions","deployment":"single-vm","machine":"throwaway","reviewed":"%s"}\n' "$(date -u +%F)" > host-policy.json
          else
            runtime=$(readlink -f "$(docker info --format '{{json .Runtimes.runsc}}' | jq -r .path)")
            printf '{"host":"github-actions","deployment":"single-vm","reviewed":"%s"}\n' "$(date -u +%F)" > host-policy.json
          fi
          jq -n --arg docker "$(real docker)" --arg git "$(real git)" --arg runtime "$runtime" --arg version "$("$runtime" --version)" --arg policy "$W/host-policy.json" \
            --arg dh "$(hash "$(real docker)")" --arg gh "$(hash "$(real git)")" --arg rh "$(hash "$runtime")" --arg ph "$(hash host-policy.json)" --arg name "$RUNTIME" \
            '{ version: 1, role: "verifier", docker: { file: $docker, sha256: $dh, endpoint: "unix:///var/run/docker.sock" }, git: { file: $git, sha256: $gh },
               runtime: { file: $runtime, sha256: $rh, version: $version, arguments: [], name: $name }, host_policy: { file: $policy, sha256: $ph } }' > verifier.json
          "$KERN_BIN" --control verifier.json doctor > doctor.json || { cat doctor.json; exit 1; }
          docker pull -q node:22-bookworm-slim > /dev/null
          printf '{"version":1,"cases":[{"command":["/usr/local/bin/npm","test"],"stdout":null}]}\n' > checks/test-suite.json
          jq -n --arg image "$(docker image inspect --format '{{.Id}}' node:22-bookworm-slim)" --arg builder "$(jq -r .builder.sha256 doctor.json)" \
            --argjson check "$("$KERN_BIN" pin-check test-suite checks/test-suite.json)" --arg repo "$GITHUB_REPOSITORY" \
            '{ version: 3, repository: $repo, deployment: "single-vm", executors: ["external"], image: $image,
               builders: { executor: null, verifier: $builder }, checks: [$check], registry: null, permissions: {} }' > operator.json

      - name: Fetch the pull request
        run: |
          set -euo pipefail
          echo fetch > "$RUNNER_TEMP/stage"
          W="$RUNNER_TEMP/kern-drive" && cd "$W"
          exec > >(tee -a step.log) 2>&1
          started=$(date +%s)
          shas="$BASE_SHA $HEAD_SHA"
          [ "$OLD_SHA" = "$BASE_SHA" ] || shas="$shas $OLD_SHA"
          git init -q pr
          git -C pr remote add origin "https://github.com/$REPO.git"
          for try in 1 2 3; do
            git -C pr fetch --quiet --no-tags --depth=200 origin $shas && break
            [ "$try" = 3 ] && { echo "::error::could not fetch $REPO at $shas"; exit 1; }
            sleep 20
          done
          for c in $shas; do git -C pr cat-file -e "$c^{commit}"; done
          if [ -n "$PATCH" ]; then
            [[ "$PATCH" =~ ^farm/loop-patches/[A-Za-z0-9_.-]+\.patch$ && -f "$GITHUB_WORKSPACE/farm-repo/$PATCH" ]] || { echo "::error::patch must be a file in farm/loop-patches"; exit 1; }
            ( export GIT_INDEX_FILE="$RUNNER_TEMP/loop-index" GIT_AUTHOR_NAME=kern-loop GIT_AUTHOR_EMAIL=loop@example.invalid GIT_COMMITTER_NAME=kern-loop GIT_COMMITTER_EMAIL=loop@example.invalid
              git -C pr read-tree "$HEAD_SHA"
              git -C pr apply --cached "$GITHUB_WORKSPACE/farm-repo/$PATCH"
              agent_sha=$(git -C pr commit-tree "$(git -C pr write-tree)" -p "$HEAD_SHA" -m "Tests the agent wrote for Kern's tasks")
              git -C pr update-ref refs/heads/kern-loop "$agent_sha"
              echo "applied $PATCH: $HEAD_SHA -> $agent_sha"
              echo "NEW_SHA=$agent_sha" >> "$GITHUB_ENV" )
          fi
          echo "fetched $REPO ($shas) in $(( $(date +%s) - started )) s; $(du -sh pr/.git | cut -f1) on disk"
          echo "$(( $(date +%s) - started ))" > fetch-seconds
          cp "$GITHUB_WORKSPACE/farm-repo/farm/pr-texts/${REPO/\//__}__$NUMBER.md" pr.md
          if [ -n "$PATCH" ] && [ -f "$GITHUB_WORKSPACE/farm-repo/${PATCH%.patch}.md" ]; then printf '\n\n' >> pr.md; cat "$GITHUB_WORKSPACE/farm-repo/${PATCH%.patch}.md" >> pr.md; fi

      - name: Kern check
        id: check
        timeout-minutes: 75
        run: |
          set +e
          set -uo pipefail
          echo check > "$RUNNER_TEMP/stage"
          W="$RUNNER_TEMP/kern-drive" && cd "$W"
          exec > >(tee -a step.log) 2>&1
          HEAD_SHA="${NEW_SHA:-$HEAD_SHA}"
          echo "kern check $REPO#$NUMBER ($AGENT): old $OLD_SHA (base_sha $BASE_SHA), new $HEAD_SHA"
          date +%s > check-started
          started=$(date +%s)
          if [ -n "$INVESTIGATION" ]; then
            [[ "$INVESTIGATION" =~ ^farm/investigations/[A-Za-z0-9_.-]+\.json$ && -f "$GITHUB_WORKSPACE/farm-repo/$INVESTIGATION" ]] || { echo "::error::investigation must be a file in farm/investigations"; exit 1; }
            export KERN_INVESTIGATION="$GITHUB_WORKSPACE/farm-repo/$INVESTIGATION"
          fi
          KERN_CHECK_AI=0 KERN_KEEP=1 "$KERN_BIN" --control verifier.json check "$W/pr" "$OLD_SHA" "$HEAD_SHA" out operator.json pr.md > check.json 2> check.err
          code=$?
          seconds=$(( $(date +%s) - started ))
          cat check.json
          tail -c 6000 check.err
          jq -n --arg repo "$REPO" --argjson number "$NUMBER" --arg agent "$AGENT" --arg base "$BASE_SHA" --arg old "$OLD_SHA" --arg head "$HEAD_SHA" \
            --argjson code "$code" --argjson seconds "$seconds" --argjson fetch "$(cat fetch-seconds 2>/dev/null || echo null)" \
            '{ repo: $repo, number: $number, agent: $agent, base_sha: $base, old_sha: $old, head_sha: $head, exit_code: $code,
               seconds: $seconds, fetch_seconds: $fetch, finished: true }' > timing.json
          echo "kern check ended with $code after $seconds s"
          exit "$code"

      - name: Collect
        if: always()
        run: |
          W="$RUNNER_TEMP/kern-drive" && A="$RUNNER_TEMP/artifact" && mkdir -p "$A"
          for f in out/receipt.json out/receipt.md out/setup.json check.json check.err step.log timing.json; do
            if [ -f "$W/$f" ]; then cp "$W/$f" "$A/"; fi
          done
          for f in "$W"/out/tests-*.err "$W"/out/tests-*.values "$W"/out/faults*.json "$W"/out/types-*.out "$W"/out/build-*.out "$W"/out/trace-*.jsonl "$W"/out/probes*.json "$W"/out/probe-*.jsonl "$W"/out/trace-probe-*.err "$W"/out/map.json "$W"/out/map.err; do [ -f "$f" ] && cp "$f" "$A/"; done
          for f in "$W"/out/tests-*.out; do [ -f "$f" ] && tail -c 40000000 "$f" > "$A/$(basename "$f")"; done
          true
          if [ ! -f "$A/timing.json" ]; then
            stage=$(cat "$RUNNER_TEMP/stage" 2>/dev/null || echo setup)
            if [ "$stage" = check ]; then why="kern check did not finish: the step timed out or the job was cancelled"; else why="the job stopped before kern check ran (step: $stage)"; fi
            seconds=null; [ -f "$W/check-started" ] && seconds=$(( $(date +%s) - $(cat "$W/check-started") ))
            jq -n --arg repo "$REPO" --argjson number "$NUMBER" --arg agent "$AGENT" --arg base "$BASE_SHA" --arg old "$OLD_SHA" --arg head "$HEAD_SHA" \
              --arg why "$why" --argjson seconds "$seconds" \
              '{ repo: $repo, number: $number, agent: $agent, base_sha: $base, old_sha: $old, head_sha: $head, seconds: $seconds, finished: false, why: $why }' > "$A/timing.json"
          fi
          suffix=""; [ "${ROUND:-0}" = 0 ] || suffix="__r$ROUND"
          echo "ARTIFACT=receipt-${REPO/\//__}__$NUMBER$suffix" >> "$GITHUB_ENV"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ runner.temp }}/artifact/
          if-no-files-found: warn
          retention-days: 30

  summary:
    needs: [plan, check]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: farm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: artifacts
      - name: Summarize
        env:
          LIST: ${{ inputs.list }}
        run: |
          python3 farm/summarize.py artifacts "$LIST" summary.md > /dev/null
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: summary
          path: summary.md
